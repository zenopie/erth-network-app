events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Disable access logs
    access_log off;
    error_log /var/log/nginx/error.log crit;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Digital Asset Links, for Android App Links on /ref/<address>.
        #
        # Must come before the SPA fallback below. `try_files ... /index.html`
        # answers a missing file with the app's HTML and a 200, so without this
        # a typo'd path returns a page that Android rejects with a parse error
        # rather than an honest 404. Content-Type is forced because Android
        # requires application/json and will not sniff.
        location /.well-known/ {
            include /etc/nginx/security-headers.conf;
            default_type application/json;
            try_files $uri =404;
        }

        # Handle client routing, fallback to index.html
        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            include /etc/nginx/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle health checks
        location /health {
            include /etc/nginx/security-headers.conf;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}