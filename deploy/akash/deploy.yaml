---
# Akash deployment — earth web app
#
# Two services: nginx serving the built static bundle, and a Cloudflare Tunnel
# connector in front of it. Same shape as the chain's deployment, and for the
# same reason: nothing is published on a provider port, so there is no address
# to update when Akash reassigns ports on a new lease.
#
# ONE TUNNEL PER DEPLOYMENT. A tunnel's replicas are chosen by proximity with no
# traffic steering, so connectors reaching different origins black-hole requests
# non-deterministically. This tunnel serves this deployment; the chain and the
# backend each have their own.
version: "2.0"

services:
  web:
    # PINNED BY CI — .github/workflows/docker-build.yml rewrites this line with
    # the digest it just pushed. Editing it by hand will be overwritten on the
    # next release.
    image: ghcr.io/zenopie/erth-network-app@sha256:d67c2c6fe7bd167913bc82ad52dea768bb633bb7c6720b6b8cb855ba14bed600
    expose:
      - port: 80
        to:
          - service: cloudflared

  cloudflared:
    # Pinned by digest, the same build as the validator's and backend's SDLs
    # (final audit W-4/BD-4). This container holds TUNNEL_TOKEN; `latest` meant
    # whatever was pushed last got it on the next lease. Bump deliberately.
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # `cloudflared` first: Akash's `command` maps to Kubernetes `command`, which
    # REPLACES the image entrypoint rather than appending to it. Without the
    # binary name the container tries to exec something called `tunnel` and the
    # service never starts — the lease reports available=0/1 with no other clue.
    command:
      - cloudflared
      - tunnel
      - --no-autoupdate
      # Metrics on loopback only (final audit W-4). The metrics server also
      # mounts Go's /debug/pprof, /config (the ingress) and /diag/*; published
      # on 0.0.0.0, anyone could read them or slow the 0.1-CPU connector.
      # Check connector health in the lease logs or the Cloudflare dashboard.
      - --metrics
      - 127.0.0.1:2000
      # No-logs policy (deploy repo NO_LOGS.md): info logs connector state
      # only. At debug cloudflared logs each request's headers, including
      # CF-Connecting-IP.
      - --loglevel
      - info
      - run

    # Akash rejects a manifest with "zero global services", so something must
    # be published. This port is: nothing listens on it outside the
    # container's loopback, so it answers nothing, and the site stays
    # reachable only through the tunnel.
    expose:
      - port: 2000
        as: 2000
        to:
          - global: true

    # TUNNEL_TOKEN is injected at deploy time from .env, never committed.
    # Anyone holding it can attach a replica and receive this tunnel's traffic.
    env: []

profiles:
  compute:
    # A static bundle behind nginx. It serves files from memory-backed page
    # cache and does no work per request, so this is sized for the container
    # rather than for the load.
    web:
      resources:
        cpu:
          units: 0.1
        memory:
          size: 128Mi
        storage:
          - size: 512Mi

    cloudflared:
      resources:
        cpu:
          units: 0.1
        memory:
          size: 128Mi
        storage:
          - size: 512Mi

  placement:
    dcloud:
      pricing:
        web:
          denom: uakt
          amount: 10000
        cloudflared:
          denom: uakt
          amount: 10000

deployment:
  web:
    dcloud:
      profile: web
      count: 1
  cloudflared:
    dcloud:
      profile: cloudflared
      count: 1
