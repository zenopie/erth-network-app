# Security headers, included by every location block in nginx.conf.
#
# Included rather than declared once at the server level, because nginx's
# add_header does not inherit into a location that sets any add_header of its
# own. Declaring these on `server` meant the static-asset block — which sets
# Cache-Control — silently dropped every one of them, so nosniff was absent from
# exactly the JavaScript and CSS it exists to protect. A block that forgets this
# include loses the headers; there is no way to make nginx merge them.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No feature this app uses needs any of these, and a wallet page is a bad place
# to leave them available to injected script.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content-Security-Policy.
#
# connect-src names the three erth hosts the app actually talks to (see
# src/chain/config.js and src/utils/config.jsx). Keplr is unaffected: an
# extension's content script and its background broadcast are not subject to
# page CSP, which is also why signing keeps working under a policy this tight.
#
# 'unsafe-inline' on style-src is load-bearing — React inline styles and the
# CSS-in-JS this app ships both set style attributes, and there is no nonce to
# hand them. It is not on script-src, which is the one that matters.
#
# The Google Fonts stylesheet is imported from src/index.css, so fonts.googleapis.com
# has to be a style source and fonts.gstatic.com a font source.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://lcd.erth.network https://rpc.erth.network https://api.erth.network; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# X-XSS-Protection is deliberately absent. Chrome removed the auditor it drove,
# and on the browsers that still honour it the filter has its own known ways of
# being turned into a vulnerability. CSP above is what replaces it.
